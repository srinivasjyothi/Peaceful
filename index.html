    <style>
        * {

        body {

        .balance-label {

        }

        .save-indicator {
            position: fixed;

            z-index: 1000;

        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

        }
        
        .add-btn {
            padding: 8px 16px;
            background: #3b82f6;

        }

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
    <div id="app"></div>
    <div id="saveIndicator" class="save-indicator hidden">✓ Saved</div>
    
    <script>
        const START_MONTH = '2026-09';
        const CURRENT_MONTH = (() => {
            const now = new Date().toISOString().slice(0, 7);
            return now < START_MONTH ? START_MONTH : now;
        })();
        
        let state = {
            activeTab: 'dashboard',
            selectedMonth: CURRENT_MONTH,
            flats: [],
            expenditures: [],
            bankTransactions: [],
            cashBankTransfers: [],
            extraCharges: {}, // { 'YYYY-MM': { amount, reason } }
            openingBalances: {
                cash: 0,
                bank: 0
            },
            modals: {
                addFlat: false,
                editFlat: null,
                addPayment: false,
                addExpenditure: false,
                editExpenditure: null,
                flatDetails: null,
                collectionDetails: false,
                expenditureDetails: false,
                arrearsDetails: false,
                openingBalances: false,
                balanceSheet: false,
                addBankTransaction: false,
                addCashBankTransfer: false,
                extraCharge: false
            },
            paymentMonthForDate: CURRENT_MONTH,
            selectedFlatForPayment: null,
            suggestedPaymentAmount: 0
        };
        
        function showSaveIndicator() {
            const indicator = document.getElementById('saveIndicator');
            indicator.classList.remove('hidden');
            setTimeout(() => indicator.classList.add('hidden'), 3000);
        }
        
        function loadData() {
            try {
                const savedFlats = localStorage.getItem('apartmentFlats');
                const savedExpenditures = localStorage.getItem('apartmentExpenditures');
                const savedBalances = localStorage.getItem('openingBalances');
                const savedBankTransactions = localStorage.getItem('bankTransactions');
                const savedCashBankTransfers = localStorage.getItem('cashBankTransfers');
                const savedExtraCharges = localStorage.getItem('extraCharges');
                
                if (savedFlats) state.flats = JSON.parse(savedFlats);
                if (savedExpenditures) state.expenditures = JSON.parse(savedExpenditures);
                if (savedBalances) state.openingBalances = JSON.parse(savedBalances);
                if (savedBankTransactions) state.bankTransactions = JSON.parse(savedBankTransactions);
                if (savedCashBankTransfers) state.cashBankTransfers = JSON.parse(savedCashBankTransfers);
                if (savedExtraCharges) state.extraCharges = JSON.parse(savedExtraCharges);
                
                if (state.selectedMonth < START_MONTH) state.selectedMonth = START_MONTH;
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }
        
        function saveData() {
            try {
                localStorage.setItem('apartmentFlats', JSON.stringify(state.flats));
                localStorage.setItem('apartmentExpenditures', JSON.stringify(state.expenditures));
                localStorage.setItem('openingBalances', JSON.stringify(state.openingBalances));
                localStorage.setItem('bankTransactions', JSON.stringify(state.bankTransactions));
                localStorage.setItem('cashBankTransfers', JSON.stringify(state.cashBankTransfers));
                localStorage.setItem('extraCharges', JSON.stringify(state.extraCharges));
                showSaveIndicator();
            } catch (error) {
                console.error('Error saving data:', error);
                alert('⚠️ Unable to save data');
            }
        }
        
        function getTodayDateString() {
            const today = new Date();
            return today.toISOString().slice(0, 10);
        }
        
        // NEW: Calculate the balance including current month's demand
        function calculateBalance(flat, month) {
            // Start with opening arrears (negative = owe, positive = advance)
            let balance = flat.openingArrears || 0;
            
            const currentDate = new Date(month + '-01');
            const startDate = new Date(START_MONTH + '-01');
            let checkDate = new Date(startDate);
            
            // Add up all monthly fees from start to current month (inclusive)
            // Also include any extra charge for each specific month
            while (checkDate <= currentDate) {
                const checkMonth = checkDate.toISOString().slice(0, 7);
                balance -= flat.monthlyFee; // Subtract regular monthly fee
                const extra = state.extraCharges[checkMonth];
                if (extra && extra.amount > 0) {
                    balance -= extra.amount; // Subtract extra charge for that specific month only
                }
                checkDate.setMonth(checkDate.getMonth() + 1);
            }
            
            // Add all payments from start to current month (inclusive)
            flat.payments.forEach(payment => {
                const paymentDate = new Date(payment.month + '-01');
                if (paymentDate >= startDate && paymentDate <= currentDate) {
                    balance += payment.amount; // Add what was paid
                }
            });
            
            return balance; // Positive = advance, Negative = arrears
        }
        
        function getExtraChargeForMonth(month) {
            return state.extraCharges[month] || null;
        }
        
        function setExtraCharge(e) {
            e.preventDefault();
            const form = e.target;
            const amount = parseFloat(form.extraAmount.value) || 0;
            const reason = form.extraReason.value.trim();
            const month = state.selectedMonth;
            
            if (amount <= 0) {
                delete state.extraCharges[month];
            } else {
                state.extraCharges[month] = { amount, reason };
            }
            saveData();
            closeModal('extraCharge');
            render();
        }
        
        function removeExtraCharge(month) {
            if (confirm('Remove extra charge for this month?')) {
                delete state.extraCharges[month];
                saveData();
                render();
            }
        }
        
        function getPaymentStatusWithBalance(flat, month) {
            const balance = calculateBalance(flat, month);
            
            // Positive balance means advance (already paid more than owed)
            if (balance >= 0) {
                return {
                    status: 'Paid',
                    balance: balance, // Amount of advance
                    type: 'advance'
                };
            } else {
                // Negative balance means arrears (owe money)
                const currentMonthPayment = flat.payments.find(p => p.month === month);
                const currentMonthPaid = currentMonthPayment ? currentMonthPayment.amount : 0;
                
                if (currentMonthPaid > 0) {
                    return { 
                        status: 'Partial', 
                        balance: balance, // Negative amount owed
                        type: 'arrears' 
                    };
                } else {
                    return { 
                        status: 'Pending', 
                        balance: balance, // Negative amount owed
                        type: 'arrears' 
                    };
                }
            }
        }
        
        function getPreviousMonth(monthStr) {
            const date = new Date(monthStr + '-01');
            date.setMonth(date.getMonth() - 1);
            return date.toISOString().slice(0, 7);
        }
        
        function getBalanceCarriedForward(month) {
            if (month === START_MONTH) {
                return { 
                    cash: state.openingBalances.cash || 0, 
                    bank: state.openingBalances.bank || 0, 
                    total: (state.openingBalances.cash || 0) + (state.openingBalances.bank || 0) 
                };
            }
            const prevMonth = getPreviousMonth(month);
            const prevStats = getMonthlyStatsForMonth(prevMonth);
            return { cash: prevStats.closingCash, bank: prevStats.closingBank, total: prevStats.closingCash + prevStats.closingBank };
        }
        
        function getMonthlyStatsForMonth(month) {
            const monthPayments = state.flats.flatMap(flat => 
                flat.payments.filter(p => p.month === month)
            );
            const monthExpenditures = state.expenditures.filter(exp => 
                exp.date.slice(0, 7) === month
            );
            const monthBankTransactions = state.bankTransactions.filter(txn =>
                txn.date.slice(0, 7) === month
            );
            const monthCashBankTransfers = state.cashBankTransfers.filter(txn =>
                txn.date.slice(0, 7) === month
            );
            
            const cashCollections = monthPayments.filter(p => p.method === 'Cash').reduce((sum, p) => sum + p.amount, 0);
            const bankCollections = monthPayments.reduce((sum, p) => p.method !== 'Cash' ? sum + p.amount : sum, 0);
            const totalCollected = cashCollections + bankCollections;
            
            const cashExpenditure = monthExpenditures.filter(e => e.paymentMethod === 'Cash').reduce((sum, e) => sum + e.amount, 0);
            const bankExpenditure = monthExpenditures.reduce((sum, e) => e.paymentMethod !== 'Cash' ? sum + e.amount : sum, 0);
            const totalExpenditure = cashExpenditure + bankExpenditure;
            
            // Calculate bank interest and charges
            const bankInterest = monthBankTransactions.filter(t => t.type === 'Interest').reduce((sum, t) => sum + t.amount, 0);
            const bankCharges = monthBankTransactions.filter(t => t.type === 'Charges').reduce((sum, t) => sum + t.amount, 0);
            
            // Calculate cash-bank transfers
            const cashToBank = monthCashBankTransfers.filter(t => t.type === 'Deposit').reduce((sum, t) => sum + t.amount, 0);
            const bankToCash = monthCashBankTransfers.filter(t => t.type === 'Withdrawal').reduce((sum, t) => sum + t.amount, 0);
            
            const balanceCF = getBalanceCarriedForward(month);
            const closingCash = balanceCF.cash + cashCollections - cashExpenditure - cashToBank + bankToCash;
            const closingBank = balanceCF.bank + bankCollections - bankExpenditure + bankInterest - bankCharges + cashToBank - bankToCash;
            
            let paidFlats = 0, totalArrears = 0, totalAdvance = 0;
            let flatsWithArrears = [];
            let flatsWithAdvance = [];
            
            state.flats.forEach(flat => {
                const statusInfo = getPaymentStatusWithBalance(flat, month);
                if (statusInfo.status === 'Paid') paidFlats++;
                if (statusInfo.balance < 0) {
                    totalArrears += Math.abs(statusInfo.balance);
                    flatsWithArrears.push({ flat, arrears: Math.abs(statusInfo.balance) });
                } else if (statusInfo.balance > 0) {
                    totalAdvance += statusInfo.balance;
                    flatsWithAdvance.push({ flat, advance: statusInfo.balance });
                }
            });
            
            return {
                totalCollected, cashCollections, bankCollections,
                totalExpenditure, cashExpenditure, bankExpenditure,
                balance: totalCollected - totalExpenditure,
                paidFlats, totalFlats: state.flats.length,
                pendingFlats: state.flats.length - paidFlats,
                monthPayments, monthExpenditures,
                totalArrears, totalAdvance,
                flatsWithArrears, flatsWithAdvance,
                openingCash: balanceCF.cash, openingBank: balanceCF.bank,
                closingCash, closingBank,
                bankInterest, bankCharges,
                monthBankTransactions,
                cashToBank, bankToCash,
                monthCashBankTransfers
            };
        }
        
        function getMonthlyStats() {
            return getMonthlyStatsForMonth(state.selectedMonth);
        }
        
        function getPaymentStatus(flat) {
            return getPaymentStatusWithBalance(flat, state.selectedMonth).status;
        }
        
        function setActiveTab(tab) {
            state.activeTab = tab;
            render();
        }
        
        function setSelectedMonth(month) {
            if (month >= START_MONTH) {
                state.selectedMonth = month;
                state.paymentMonthForDate = month;
                render();
            } else {
                alert('Cannot select months before September 2026');
            }
        }
        
        function openModal(modal) {
            state.modals[modal] = true;
            // Reset payment month when opening payment modal
            if (modal === 'addPayment') {
                state.paymentMonthForDate = state.selectedMonth;
            }
            render();
        }
        
        function closeModal(modal) {
            state.modals[modal] = false;
            if (modal === 'addPayment') {
                state.selectedFlatForPayment = null;
                state.suggestedPaymentAmount = 0;
            }
            if (modal === 'editFlat') state.modals.editFlat = null;
            render();
        }
        
        function showFlatPayment(flat) {
            // Check if flat has advance payment that covers this month
            const statusInfo = getPaymentStatusWithBalance(flat, state.selectedMonth);
            if (statusInfo.balance >= 0) {
                // Has advance, don't open payment modal
                return;
            }
            
            // Calculate the amount due (absolute value of negative balance)
            const amountDue = Math.abs(statusInfo.balance);
            
            state.selectedFlatForPayment = flat;
            state.suggestedPaymentAmount = amountDue;
            state.modals.addPayment = true;
            render();
        }

        function getDateRangeForMonth(monthStr) {
            const year = parseInt(monthStr.split('-')[0]);
            const month = parseInt(monthStr.split('-')[1]);
            
            // First day of the selected month
            const firstDay = new Date(year, month - 1, 1);
            // Last day of the selected month
            const lastDay = new Date(year, month, 0);
            
            // Get today's date
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            // Min date is the 1st of the selected month
            const minDate = firstDay.toISOString().slice(0, 10);
            
            // Max date is the earlier of: last day of month OR today
            let maxDate = lastDay.toISOString().slice(0, 10);
            const todayStr = today.toISOString().slice(0, 10);
            if (maxDate > todayStr) {
                maxDate = todayStr;
            }
            
            // Default date should be today if it's within the month, otherwise 1st of month
            let defaultDate;
            if (todayStr >= minDate && todayStr <= maxDate) {
                defaultDate = todayStr; // Today is within this month
            } else if (todayStr < minDate) {
                defaultDate = minDate; // Today is before this month, use 1st
            } else {
                defaultDate = maxDate; // Today is after this month, use last valid date
            }
            
            return { minDate, maxDate, defaultDate };
        }

        function recordPayment(e) {
            e.preventDefault();
            const form = e.target;
            const flatId = parseInt(form.flatId.value);
            const flat = state.flats.find(f => f.id === flatId);
            const selectedMonth = form.month.value;
            const paymentDate = form.date.value;
            
            // Validation 1: Cannot record payments before START_MONTH
            if (selectedMonth < START_MONTH) {
                alert('Cannot record payments before September 2026');
                return;
            }
            
            // Validation 2: Payment date must be within selected month
            const paymentMonthFromDate = paymentDate.slice(0, 7);
            if (paymentMonthFromDate !== selectedMonth) {
                alert('Payment date must be within the selected month (' + selectedMonth + ')');
                return;
            }
            
            // Validation 3: Payment date cannot be in the future
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const paymentDateObj = new Date(paymentDate);
            if (paymentDateObj > today) {
                alert('Payment date cannot be in the future');
                return;
            }
            
            // Validation 4: Cannot collect payment for future months
            const currentYearMonth = new Date().toISOString().slice(0, 7);
            if (selectedMonth > currentYearMonth) {
                alert('Cannot collect payments for future months. Current month is ' + currentYearMonth);
                return;
            }
            
            if (flat) {
                flat.payments.push({
                    id: Date.now(),
                    month: selectedMonth,
                    amount: parseFloat(form.amount.value),
                    date: paymentDate,
                    method: form.method.value
                });
                saveData();
                closeModal('addPayment');
                form.reset();
                render();
            }
        }

                    <div class="balance-row"><span class="balance-label">Total Spent</span><span class="balance-value">₹${stats.totalExpenditure.toLocaleString()}</span></div>
                    <div class="balance-row"><span class="balance-label">Cash</span><span class="balance-value" style="color: #ef4444;">₹${stats.cashExpenditure.toLocaleString()}</span></div>
                    <div class="balance-row"><span class="balance-label">Bank</span><span class="balance-value" style="color: #ef4444;">₹${stats.bankExpenditure.toLocaleString()}</span></div>
                </div>
                <div style="margin-top: 20px;">
                    <div style="font-weight: bold; margin-bottom: 12px;">All Expenses</div>
                    ${stats.monthExpenditures.length > 0 ? `
                        <div class="item-list">
                            ${stats.monthExpenditures.map(exp => `
                                <div class="item">
                                    <div class="item-header">
                                        <div>
                                            <div class="item-title">${exp.description}</div>
                                            <div class="item-subtitle">${exp.category} • ${new Date(exp.date).toLocaleDateString()} • ${exp.paymentMethod}</div>
                                        </div>
                                        <div class="item-amount" style="color: #ef4444;">₹${exp.amount.toLocaleString()}</div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    ` : '<div style="color: #9ca3af; text-align: center; padding: 20px;">No expenses</div>'}
                </div>
                </div></div></div>`;
            }
            
            // Arrears Details Modal
            if (state.modals.arrearsDetails) {
                html += `<div class="modal-overlay" onclick="closeModal('arrearsDetails')"></div>
                <div class="modal"><div class="modal-content"><div class="modal-header">
                <div class="modal-title">Arrears Details</div>
                <button class="close-btn" onclick="closeModal('arrearsDetails')">×</button>
                </div><div class="modal-body">
                <div style="font-weight: bold; margin-bottom: 12px;">Flats with Arrears</div>
                ${stats.flatsWithArrears.length > 0 ? `
                    <div class="item-list">
                        ${stats.flatsWithArrears.map(({flat, arrears}) => `
                            <div class="item">
                                <div class="item-header">
                                    <div>
                                        <div class="item-title">${flat.flatNumber} - ${flat.ownerName}</div>
                                        <div class="item-subtitle">Monthly Fee: ₹${flat.monthlyFee.toLocaleString()}</div>
                                    </div>
                                    <div class="item-amount" style="color: #f59e0b;">₹${arrears.toLocaleString()}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                ` : '<div style="color: #9ca3af; text-align: center; padding: 20px;">No arrears</div>'}
                <div class="balance-card" style="margin-top: 20px;">
                    <div class="balance-row">
                        <span class="balance-label" style="font-weight: bold;">Total Arrears</span>
                        <span class="balance-value" style="color: #f59e0b; font-size: 20px;">₹${stats.totalArrears.toLocaleString()}</span>
                    </div>
                </div>
                </div></div></div>`;
            }
            
            // Add Flat Modal
            if (state.modals.addFlat) {
                html += `<div class="modal-overlay" onclick="closeModal('addFlat')"></div>
                <div class="modal"><div class="modal-content"><div class="modal-header">
                <div class="modal-title">Add Flat</div>
                <button class="close-btn" onclick="closeModal('addFlat')">×</button>
                </div><div class="modal-body">
                <div class="info-box">💡 Opening balance: negative = arrears, positive = advance</div>
                <form onsubmit="addFlat(event)">
                    <div class="form-group"><label class="form-label">Flat Number *</label>
                    <input type="text" name="flatNumber" class="form-input" placeholder="A-101" required></div>
                    <div class="form-group"><label class="form-label">Owner Name *</label>
                    <input type="text" name="ownerName" class="form-input" required></div>
                    <div class="form-group"><label class="form-label">Monthly Fee (₹) *</label>
                    <input type="number" name="monthlyFee" class="form-input" step="0.01" required></div>
                    <div class="form-group"><label class="form-label">Phone</label>
                    <input type="tel" name="phoneNumber" class="form-input"></div>
                    <div class="form-group"><label class="form-label">Opening Balance (Sep 2026)</label>
                    <input type="number" name="openingArrears" class="form-input" placeholder="-5000 or +5000" step="0.01"></div>
                    <button type="submit" class="submit-btn blue">Add Flat</button>
                </form></div></div></div>`;
            }
            
            // Edit Flat Modal
            if (state.modals.editFlat) {
                const flat = state.modals.editFlat;
                html += `<div class="modal-overlay" onclick="closeModal('editFlat')"></div>
                <div class="modal"><div class="modal-content"><div class="modal-header">
                <div class="modal-title">Edit Flat</div>
                <button class="close-btn" onclick="closeModal('editFlat')">×</button>
                </div><div class="modal-body">
                <form onsubmit="updateFlat(event)">
                    <input type="hidden" name="flatId" value="${flat.id}">
                    <div class="form-group"><label class="form-label">Flat Number *</label>
                    <input type="text" name="flatNumber" class="form-input" value="${flat.flatNumber}" required></div>
                    <div class="form-group"><label class="form-label">Owner Name *</label>
                    <input type="text" name="ownerName" class="form-input" value="${flat.ownerName}" required></div>
                    <div class="form-group"><label class="form-label">Monthly Fee (₹) *</label>
                    <input type="number" name="monthlyFee" class="form-input" value="${flat.monthlyFee}" step="0.01" required></div>
                    <div class="form-group"><label class="form-label">Phone</label>
                    <input type="tel" name="phoneNumber" class="form-input" value="${flat.phoneNumber || ''}"></div>
                    <div class="form-group"><label class="form-label">Opening Balance (Sep 2026)</label>
                    <input type="number" name="openingArrears" class="form-input" value="${flat.openingArrears || 0}" step="0.01"></div>
                    <button type="submit" class="submit-btn blue">Update Flat</button>
                    <button type="button" class="submit-btn red" style="margin-top: 8px;" onclick="deleteFlat(${flat.id})">Delete Flat</button>
                </form></div></div></div>`;
            }
            
            // Add Payment Modal
            if (state.modals.addPayment) {
                const currentYearMonth = new Date().toISOString().slice(0, 7);
                const paymentDateRange = getDateRangeForMonth(state.paymentMonthForDate);
                const suggestedAmount = state.suggestedPaymentAmount > 0 ? state.suggestedPaymentAmount : '';
                html += `<div class="modal-overlay" onclick="closeModal('addPayment')"></div>
                <div class="modal"><div class="modal-content"><div class="modal-header">
                <div class="modal-title">Record Payment</div>
                <button class="close-btn" onclick="closeModal('addPayment')">×</button>
                </div><div class="modal-body">
                ${getExtraChargeForMonth(state.paymentMonthForDate) ? `<div class="info-box" style="background:#f0fdf4;border-color:#0d9488;color:#0f766e;">✨ Extra charge of ₹${getExtraChargeForMonth(state.paymentMonthForDate).amount.toLocaleString()} is included for ${state.paymentMonthForDate} (${getExtraChargeForMonth(state.paymentMonthForDate).reason})</div>` : ''}
                <div class="warning-box">⚠️ Date must start from 1st of selected month and cannot be in future. Cannot collect for future months.</div>
                <form onsubmit="recordPayment(event)">
                    <div class="form-group"><label class="form-label">Flat *</label>
                    <select name="flatId" class="form-select" onchange="updateSelectedFlat(this.value)" required>
                        ${state.selectedFlatForPayment ? `<option value="${state.selectedFlatForPayment.id}" selected>${state.selectedFlatForPayment.flatNumber} - ${state.selectedFlatForPayment.ownerName}</option>` : '<option value="">Choose</option>'}
                        ${state.flats.filter(f => !state.selectedFlatForPayment || f.id !== state.selectedFlatForPayment.id).map(f => `<option value="${f.id}">${f.flatNumber} - ${f.ownerName}</option>`).join('')}
                    </select></div>
                    <div class="form-group"><label class="form-label">Month * (Up to ${currentYearMonth})</label>
                    <input type="month" name="month" class="form-input" value="${state.paymentMonthForDate}" min="${START_MONTH}" max="${currentYearMonth}" onchange="updatePaymentMonth(this.value)" required></div>
                    <div class="form-group"><label class="form-label">Date * (${paymentDateRange.minDate} to ${paymentDateRange.maxDate})</label>
                    <input type="date" name="date" class="form-input" min="${paymentDateRange.minDate}" max="${paymentDateRange.maxDate}" value="${paymentDateRange.defaultDate}" required></div>
                    <div class="form-group"><label class="form-label">Amount (₹) * ${suggestedAmount ? '<span style="color: #10b981; font-size: 12px; font-weight: normal;">(Due: ₹' + suggestedAmount.toLocaleString() + ' - editable)</span>' : ''}</label>
                    <input type="number" name="amount" class="form-input" step="0.01" value="${suggestedAmount}" placeholder="Enter amount received" required></div>
                    <div class="form-group"><label class="form-label">Method *</label>
                    <select name="method" class="form-select">
                        <option>Cash</option><option>UPI</option><option>Bank Transfer</option><option>Cheque</option>
                    </select></div>
                    <button type="submit" class="submit-btn green">Record Payment</button>
                </form></div></div></div>`;
            }
            
            // Add Expenditure Modal
            if (state.modals.addExpenditure) {
                html += `<div class="modal-overlay" onclick="closeModal('addExpenditure')"></div>
                <div class="modal"><div class="modal-content"><div class="modal-header">
                <div class="modal-title">Add Expense</div>
                <button class="close-btn" onclick="closeModal('addExpenditure')">×</button>
                </div><div class="modal-body">
                <form onsubmit="addExpenditure(event)">
                    <div class="form-group"><label class="form-label">Description *</label>
                    <input type="text" name="description" class="form-input" required></div>
                    <div class="form-group"><label class="form-label">Category *</label>
                    <select name="category" class="form-select">
                        <option>Cleaning</option><option>Security</option><option>Repairs</option><option>Electricity</option><option>Water</option><option>Gardening</option><option>Lift Maintenance</option><option>Pest Control</option><option>Others</option>
                    </select></div>
                    <div class="form-group"><label class="form-label">Amount (₹) *</label>
                    <input type="number" name="amount" class="form-input" step="0.01" required></div>
                    <div class="form-group"><label class="form-label">Date *</label>
                    <input type="date" name="date" class="form-input" value="${getTodayDateString()}" min="2026-09-01" required></div>
                    <div class="form-group"><label class="form-label">Vendor</label>
                    <input type="text" name="vendor" class="form-input"></div>
                    <div class="form-group"><label class="form-label">Payment Method *</label>
                    <select name="paymentMethod" class="form-select">
                        <option>Cash</option><option>UPI</option><option>Bank Transfer</option><option>Cheque</option>
                    </select></div>
                    <button type="submit" class="submit-btn red">Add Expense</button>
                </form></div></div></div>`;
            }
            
            // Add Bank Transaction Modal
            if (state.modals.addBankTransaction) {
                html += `<div class="modal-overlay" onclick="closeModal('addBankTransaction')"></div>
                <div class="modal"><div class="modal-content"><div class="modal-header">
                <div class="modal-title">Bank Transaction</div>
                <button class="close-btn" onclick="closeModal('addBankTransaction')">×</button>
                </div><div class="modal-body">
                <div class="info-box">💡 Add bank interest earned or bank charges deducted</div>
                <form onsubmit="addBankTransaction(event)">
                    <div class="form-group"><label class="form-label">Type *</label>
                    <select name="type" class="form-select" required>
                        <option value="Interest">Interest Earned (+)</option>
                        <option value="Charges">Bank Charges (-)</option>
                    </select></div>
                    <div class="form-group"><label class="form-label">Description *</label>
                    <input type="text" name="description" class="form-input" placeholder="e.g., Monthly interest, Service charge" required></div>
                    <div class="form-group"><label class="form-label">Amount (₹) *</label>
                    <input type="number" name="amount" class="form-input" step="0.01" required></div>
                    <div class="form-group"><label class="form-label">Date *</label>
                    <input type="date" name="date" class="form-input" value="${getTodayDateString()}" min="2026-09-01" required></div>
                    <button type="submit" class="submit-btn" style="background: #8b5cf6;">Add Transaction</button>
                </form>
                ${state.bankTransactions.length > 0 ? `
                <div style="margin-top: 20px;">
                    <div style="font-weight: bold; margin-bottom: 12px;">Recent Transactions</div>
                    <div class="item-list" style="max-height: 200px;">
                        ${state.bankTransactions.sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 5).map(txn => `
                            <div class="item" style="display: flex; justify-content: space-between; align-items: center;">
                                <div style="flex: 1;">
                                    <div style="font-weight: 600; font-size: 14px; color: #1f2937;">${txn.description}</div>
                                    <div style="font-size: 12px; color: #6b7280;">${new Date(txn.date).toLocaleDateString()} • ${txn.type}</div>
                                </div>
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <span style="font-weight: bold; color: ${txn.type === 'Interest' ? '#10b981' : '#ef4444'};">
                                        ${txn.type === 'Interest' ? '+' : '-'}₹${txn.amount.toLocaleString()}
                                    </span>
                                    <button class="delete-btn" onclick="event.stopPropagation(); deleteBankTransaction(${txn.id})" style="margin: 0;">×</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>` : ''}
                </div></div></div>`;
            }
            
            // Add Cash-Bank Transfer Modal
            if (state.modals.addCashBankTransfer) {
                html += `<div class="modal-overlay" onclick="closeModal('addCashBankTransfer')"></div>
                <div class="modal"><div class="modal-content"><div class="modal-header">
                <div class="modal-title">Cash ↔ Bank Transfer</div>
                <button class="close-btn" onclick="closeModal('addCashBankTransfer')">×</button>
                </div><div class="modal-body">
                <div class="info-box">💡 Deposit cash to bank or withdraw cash from bank</div>
                <form onsubmit="addCashBankTransfer(event)">
                    <div class="form-group"><label class="form-label">Transfer Type *</label>
                    <select name="type" class="form-select" required>
                        <option value="Deposit">Deposit to Bank (Cash → Bank)</option>
                        <option value="Withdrawal">Withdraw to Cash (Bank → Cash)</option>
                    </select></div>
                    <div class="form-group"><label class="form-label">Description *</label>
                    <input type="text" name="description" class="form-input" placeholder="e.g., Cash deposit, ATM withdrawal" required></div>
                    <div class="form-group"><label class="form-label">Amount (₹) *</label>
                    <input type="number" name="amount" class="form-input" step="0.01" required></div>
                    <div class="form-group"><label class="form-label">Date *</label>
                    <input type="date" name="date" class="form-input" value="${getTodayDateString()}" min="2026-09-01" required></div>
                    <button type="submit" class="submit-btn" style="background: #f59e0b;">Add Transfer</button>
                </form>
                ${state.cashBankTransfers.length > 0 ? `
                <div style="margin-top: 20px;">
                    <div style="font-weight: bold; margin-bottom: 12px;">Recent Transfers</div>
                    <div class="item-list" style="max-height: 200px;">
                        ${state.cashBankTransfers.sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 5).map(txn => `
                            <div class="item" style="display: flex; justify-content: space-between; align-items: center;">
                                <div style="flex: 1;">
                                    <div style="font-weight: 600; font-size: 14px; color: #1f2937;">${txn.description}</div>
                                    <div style="font-size: 12px; color: #6b7280;">${new Date(txn.date).toLocaleDateString()} • ${txn.type}</div>
                                </div>
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <span style="font-weight: bold; color: #f59e0b;">₹${txn.amount.toLocaleString()}</span>
                                    <button class="delete-btn" onclick="event.stopPropagation(); deleteCashBankTransfer(${txn.id})" style="margin: 0;">×</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>` : ''}
                </div></div></div>`;
            }
            
            // Extra Charge Modal
            if (state.modals.extraCharge) {
                const ec = getExtraChargeForMonth(state.selectedMonth);
                const monthName = new Date(state.selectedMonth + '-01').toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
                html += `<div class="modal-overlay" onclick="closeModal('extraCharge')"></div>
                <div class="modal"><div class="modal-content"><div class="modal-header">
                <div class="modal-title">✨ Extra Charge — ${monthName}</div>
                <button class="close-btn" onclick="closeModal('extraCharge')">×</button>
                </div><div class="modal-body">
                <div class="info-box">💡 Set a one-time extra amount to collect from <strong>each flat</strong> this month only. This will not affect any other month's maintenance.</div>
                ${ec ? `<div class="warning-box">⚠️ An extra charge of ₹${ec.amount.toLocaleString()} is already set for this month (${ec.reason || 'No reason given'}). Submitting below will overwrite it.</div>` : ''}
                <form onsubmit="setExtraCharge(event)">
                    <div class="form-group"><label class="form-label">Extra Amount per Flat (₹) *</label>
                    <input type="number" name="extraAmount" class="form-input" step="0.01" min="0" placeholder="e.g. 500" value="${ec ? ec.amount : ''}" required></div>
                    <div class="form-group"><label class="form-label">Reason / Description *</label>
                    <input type="text" name="extraReason" class="form-input" placeholder="e.g. Lift repair, Water tank cleaning" value="${ec ? ec.reason : ''}" required></div>
                    ${state.flats.length > 0 ? `<div class="info-box" style="background:#f0fdf4; border-color:#10b981; color:#065f46;">📊 Total extra to collect from all ${state.flats.length} flats: <strong>₹<span id="extraTotal">${ec ? (ec.amount * state.flats.length).toLocaleString() : '0'}</span></strong></div>` : ''}
                    <button type="submit" class="submit-btn" style="background: linear-gradient(135deg, #0d9488, #0f766e);">✅ Set Extra Charge</button>
                    ${ec ? `<button type="button" onclick="removeExtraCharge('${state.selectedMonth}')" style="width:100%; margin-top:12px; padding:12px; border:2px solid #ef4444; background:white; color:#ef4444; border-radius:8px; font-weight:bold; cursor:pointer;">🗑️ Remove Extra Charge</button>` : ''}
                </form>
                <script>
                (function() {
                    const inp = document.querySelector('input[name="extraAmount"]');
                    const span = document.getElementById('extraTotal');
                    if (inp && span) {
                        inp.addEventListener('input', function() {
                            const v = parseFloat(this.value) || 0;
                            span.textContent = (v * ${state.flats.length}).toLocaleString('en-IN');
                        });
                    }
                })();
                <\/script>
                </div></div></div>`;
            }
            
            // Edit Expenditure Modal
            if (state.modals.editExpenditure) {
                const exp = state.modals.editExpenditure;
                html += `<div class="modal-overlay" onclick="state.modals.editExpenditure = null; render();"></div>
                <div class="modal"><div class="modal-content"><div class="modal-header">
                <div class="modal-title">Edit Expense</div>
                <button class="close-btn" onclick="state.modals.editExpenditure = null; render();">×</button>
                </div><div class="modal-body">
                <form onsubmit="updateExpenditure(event)">
                    <input type="hidden" name="expId" value="${exp.id}">
                    <div class="form-group"><label class="form-label">Description *</label>
                    <input type="text" name="description" class="form-input" value="${exp.description}" required></div>
                    <div class="form-group"><label class="form-label">Category *</label>
                    <select name="category" class="form-select">
                        <option ${exp.category === 'Cleaning' ? 'selected' : ''}>Cleaning</option>
                        <option ${exp.category === 'Security' ? 'selected' : ''}>Security</option>
                        <option ${exp.category === 'Repairs' ? 'selected' : ''}>Repairs</option>
                        <option ${exp.category === 'Electricity' ? 'selected' : ''}>Electricity</option>
                        <option ${exp.category === 'Water' ? 'selected' : ''}>Water</option>
                        <option ${exp.category === 'Gardening' ? 'selected' : ''}>Gardening</option>
                        <option ${exp.category === 'Lift Maintenance' ? 'selected' : ''}>Lift Maintenance</option>
                        <option ${exp.category === 'Pest Control' ? 'selected' : ''}>Pest Control</option>
                        <option ${exp.category === 'Others' ? 'selected' : ''}>Others</option>
                    </select></div>
                    <div class="form-group"><label class="form-label">Amount (₹) *</label>
                    <input type="number" name="amount" class="form-input" value="${exp.amount}" step="0.01" required></div>
                    <div class="form-group"><label class="form-label">Date *</label>
                    <input type="date" name="date" class="form-input" value="${exp.date}" min="2026-09-01" required></div>
                    <div class="form-group"><label class="form-label">Vendor</label>
                    <input type="text" name="vendor" class="form-input" value="${exp.vendor || ''}"></div>
                    <div class="form-group"><label class="form-label">Payment Method *</label>
                    <select name="paymentMethod" class="form-select">
                        <option ${(exp.paymentMethod === 'Cash' || !exp.paymentMethod) ? 'selected' : ''}>Cash</option>
                        <option ${exp.paymentMethod === 'UPI' ? 'selected' : ''}>UPI</option>
                        <option ${exp.paymentMethod === 'Bank Transfer' ? 'selected' : ''}>Bank Transfer</option>
                        <option ${exp.paymentMethod === 'Cheque' ? 'selected' : ''}>Cheque</option>
                    </select></div>
                    <button type="submit" class="submit-btn blue">Update Expense</button>
                </form></div></div></div>`;
            }
            
            return html;
        }
        
        loadData();
        render();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js').catch((err) => {
                    console.error('Service worker registration failed:', err);
                });
            });
        }
    </script>
</body>
</html>
